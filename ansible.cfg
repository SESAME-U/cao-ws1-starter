# Ansible reads this file because it sits in the directory you run Ansible from.
# Check which config is active with:  ansible --version
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = azureuser
private_key_file = ~/.ssh/cao_lab
host_key_checking = False
interpreter_python = auto_silent
forks = 10
# Temporary files of become_user tasks (www-data cannot write its own home)
remote_tmp = /tmp/.ansible-${USER}/tmp
# Once "make vault-pass" has created the file, remove the # below.
# vault_password_file = ~/.cao_ws1_vault_pass

[ssh_connection]
pipelining = True
